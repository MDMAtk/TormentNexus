version: "3.8"

services:
  tormentnexus:
    image: tormentnexus/tormentnexus:latest
    container_name: tormentnexus
    ports:
      - "7778:7778"
    volumes:
      - tormentnexus-data:/root/.tormentnexus
    environment:
      - TN_HOST=0.0.0.0
      - TN_PORT=7778
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7778/health"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

volumes:
  tormentnexus-data:
    driver: local
