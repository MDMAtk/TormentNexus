version: "3.8"

services:
  hypernexus:
    image: hypernexus/hypernexus:latest
    container_name: hypernexus
    ports:
      - "7778:7778"
    volumes:
      - hypernexus-data:/root/.hypernexus
    environment:
      - TN_HOST=0.0.0.0
      - TN_PORT=7778
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7778/health"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

volumes:
  hypernexus-data:
    driver: local
