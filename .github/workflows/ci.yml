name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Build main binary
        run: |
          cd go
          go build -buildvcs=false \
            -o tormentnexus-bin ./cmd/tormentnexus
      - name: Vet
        run: cd go && go vet ./... 2>&1 | head -50 || true
      - name: Test
        run: |
          cd go
          go test ./... -count=1 -timeout 60s \
            2>&1 | head -50 || true
