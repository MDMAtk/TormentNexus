version: "3.8"
services:
  openhands:
    image: ghcr.io/all-hands-ai/openhands:latest
    ports:
      - "3005:3000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ~/.openhands:/home/openhands/.openhands
      - ./workspace:/opt/workspace_base
    environment:
      - SANDBOX_RUNTIME_CONTAINER_IMAGE=ghcr.io/all-hands-ai/openhands-sandbox
      - LLM_API_KEY=${OPENAI_API_KEY}
      - LLM_MODEL=gpt-4o
      - HYPERNEXUS_URL=http://hypernexus:7778
    depends_on:
      - hypernexus
    restart: always

  hypernexus:
    image: hypernexus-core:latest
    ports:
      - "7778:7778"
    volumes:
      - hypernexus_data:/data
    environment:
      - HYPERNEXUS_WORKSPACE_ROOT=/data
    restart: always

volumes:
  hypernexus_data:
