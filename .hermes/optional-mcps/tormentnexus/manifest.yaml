manifest_version: 1

name: hypernexus
description: HyperNexus AI control plane — persistent L2 vector memory, semantic tool discovery, imported sessions, skill registry, code search, subagent orchestration
source: https://github.com/robertpelloni/hypernexus

transport:
  type: stdio
  command: C:\Users\hyper\workspace\hypernexus\hypernexus.exe
  args:
    - mcp
  env:
    HYPERNEXUS_WORKSPACE_ROOT: C:\Users\hyper\workspace\hypernexus

auth:
  type: none
