# HyperNexus Goose Extension
#
# Goose uses MCP as its extension mechanism. Add this to
# ~/.config/goose/config.yaml under the `extensions:` block.
#
# Or install via: goose configure → Add extension → Built-in

extensions:
  hypernexus:
    type: stdio
    command: C:\Users\hyper\workspace\hypernexus\hypernexus.exe
    args:
      - mcp
    env:
      HYPERNEXUS_WORKSPACE_ROOT: C:\Users\hyper\workspace\hypernexus
    description: HyperNexus AI control plane — L2 memory, tool discovery, session import
    timeout: 30
    enabled: true
